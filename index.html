<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PC Setup Generator</title>
</head>
<body>
  <main>
    <h1>PC Setup Generator</h1>
    <p class="sub">Pick your terminal, tick what you want, then copy and paste the script.</p>

    <section class="card">
      <label for="shell"><strong>Terminal</strong></label>
      <select id="shell">
        <option value="bash">Bash (Linux / Git Bash)</option>
        <option value="zsh">Zsh (macOS / Linux)</option>
        <option value="fish">Fish (CachyOS / Arch)</option>
        <option value="ps">PowerShell (Windows)</option>
      </select>
    </section>

    <div id="groups"></div>

    <div class="bar">
      <button id="copy">Copy script</button>
      <span id="msg"></span>
    </div>
    <pre id="out"></pre>
    <p id="hint" hidden></p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
